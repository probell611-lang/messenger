<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gifts Market — Telegram Mini App</title>
<style>
  :root{
    --bg:#FFFFFF;
    --page:#EEF0F4;
    --bg-2:#F1F2F6;
    --bg-3:#F6F7FA;
    --text:#0B0C0F;
    --text-2:#8B90A0;
    --divider:#EEEFF3;
    --blue:#0098EA;
    --blue-dark:#0077BD;
    --blue-tint:#E6F6FF;
    --green:#28C980;
    --radius-card:18px;
    --ff:'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    background:var(--page);
    font-family:var(--ff);
    color:var(--text);
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:36px 16px;
  }
  button{font-family:inherit; border:none; background:none; cursor:pointer;}
  input,select{font-family:inherit;}

  /* ---------------- device shell ---------------- */
  .device{
    width:382px;
    background:#0E0F12;
    border-radius:56px;
    padding:14px;
    box-shadow:0 40px 80px -20px rgba(10,14,30,0.45), 0 0 0 1px rgba(0,0,0,0.06);
  }
  .device-screen{
    background:var(--bg);
    border-radius:42px;
    height:812px;
    overflow:hidden;
    position:relative;
    display:flex; flex-direction:column;
  }
  .island{
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    width:114px; height:32px; background:#0E0F12; border-radius:20px; z-index:40;
  }
  .statusbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 26px 4px; font-size:15px; font-weight:600; flex-shrink:0;
  }
  .statusbar .icons{display:flex; align-items:center; gap:5px;}
  .sb-signal{display:flex; align-items:flex-end; gap:1.5px; height:10px;}
  .sb-signal i{width:3px; background:#0B0C0F; border-radius:1px;}
  .sb-signal i:nth-child(1){height:4px;} .sb-signal i:nth-child(2){height:6px;}
  .sb-signal i:nth-child(3){height:8px;} .sb-signal i:nth-child(4){height:10px;}
  .sb-battery{width:23px; height:11px; border:1.4px solid #0B0C0F; border-radius:3px; position:relative; padding:1.5px;}
  .sb-battery::after{content:'';position:absolute; right:-3.5px; top:3px; width:2px; height:5px; background:#0B0C0F; border-radius:0 1px 1px 0;}
  .sb-battery i{display:block; height:100%; width:80%; background:#0B0C0F; border-radius:1px;}

  @media(max-width:460px){
    body{padding:0; align-items:stretch;}
    .device{width:100%; border-radius:0; padding:0; box-shadow:none;}
    .device-screen{border-radius:0; height:100vh; height:100dvh;}
    .island{display:none;}
  }

  /* ---------------- header ---------------- */
  .app-header{padding:6px 14px 0; flex-shrink:0;}
  .head-row{display:flex; align-items:center; justify-content:space-between; padding:8px 2px;}
  .pill-btn{
    display:flex; align-items:center; gap:6px;
    background:var(--bg-2); border-radius:999px; padding:8px 15px;
    font-size:14px; font-weight:600; color:var(--text);
  }
  .icon-btn{
    width:34px; height:34px; border-radius:50%; background:var(--bg-2);
    display:flex; align-items:center; justify-content:center; font-size:15px; color:var(--text-2);
  }
  .head-right{display:flex; align-items:center; gap:8px;}
  .back-btn{font-size:20px; font-weight:700; width:34px; height:34px; border-radius:50%; background:var(--bg-2); display:flex; align-items:center; justify-content:center;}

  .balance-row{display:flex; align-items:center; justify-content:space-between; padding:2px 2px 12px;}
  .user-pill{display:flex; align-items:center; gap:8px;}
  .avatar{width:30px; height:30px; border-radius:50%; background:linear-gradient(155deg,#FFC26B,#FF8A5C); display:flex; align-items:center; justify-content:center; font-size:15px;}
  .star-pill{display:flex; align-items:center; gap:4px; background:var(--bg-2); border-radius:999px; padding:6px 12px 6px 10px; font-size:13.5px; font-weight:700;}
  .ton-pill{display:flex; align-items:center; gap:0; background:var(--blue); border-radius:999px; overflow:hidden;}
  .ton-pill-inner{display:flex; align-items:center; gap:6px; padding:8px 12px 8px 14px; color:#fff; font-size:14px; font-weight:700;}
  .ton-diamond{width:16px; height:16px; flex-shrink:0;}
  .ton-add{width:30px; height:30px; margin:2px 2px 2px 0; border-radius:50%; background:rgba(255,255,255,0.22); display:flex; align-items:center; justify-content:center; color:#fff; font-size:16px; font-weight:700;}

  .tabs-row{display:flex; gap:6px; background:var(--bg-2); border-radius:14px; padding:4px; margin:0 2px 12px;}
  .tab-btn{flex:1; text-align:center; padding:9px 0; border-radius:11px; font-size:13.5px; font-weight:700; color:var(--text-2);}
  .tab-btn.active{background:#fff; color:var(--text); box-shadow:0 1px 3px rgba(10,14,30,0.12);}

  /* ---------------- scroll body ---------------- */
  .app-body{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:24px;}
  .app-body::-webkit-scrollbar{display:none;}
  .screen{display:none; padding:0 14px;}
  .screen.active{display:block;}

  /* ---------------- total price card ---------------- */
  .total-card{
    background:linear-gradient(135deg, var(--blue), var(--blue-dark));
    border-radius:20px; padding:16px 18px; margin-bottom:14px; color:#fff;
    display:none;
  }
  .total-card.show{display:block;}
  .total-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .total-label{display:flex; align-items:center; gap:6px; font-size:13px; font-weight:700; opacity:0.92;}
  .total-actions{display:flex; align-items:center; gap:6px;}
  .reset-btn{display:flex; align-items:center; gap:5px; background:rgba(255,255,255,0.18); border-radius:999px; padding:6px 12px; font-size:12px; font-weight:700; color:#fff;}
  .kebab-btn{width:28px; height:28px; border-radius:50%; background:rgba(255,255,255,0.18); display:flex; align-items:center; justify-content:center; color:#fff; font-size:14px;}
  .total-value{font-size:32px; font-weight:800; letter-spacing:-0.02em;}
  .total-sub{font-size:13px; opacity:0.78; margin-top:3px; font-weight:600;}

  /* ---------------- search + filters ---------------- */
  .search-row{display:flex; gap:8px; margin-bottom:10px;}
  .search-box{flex:1; display:flex; align-items:center; gap:8px; background:var(--bg-3); border-radius:13px; padding:10px 14px;}
  .search-box input{border:none; background:none; outline:none; font-size:14px; width:100%; color:var(--text);}
  .search-box input::placeholder{color:var(--text-2);}
  .filter-icon-btn{width:40px; flex-shrink:0; background:var(--bg-3); border-radius:13px; display:flex; align-items:center; justify-content:center; color:var(--text-2); font-size:15px;}

  .filter-row{display:flex; gap:7px; margin-bottom:14px; overflow-x:auto;}
  .filter-row::-webkit-scrollbar{display:none;}
  .filter-chip{
    display:flex; align-items:center; gap:4px; flex-shrink:0;
    background:var(--bg-3); border-radius:999px; padding:8px 12px; font-size:12.5px; font-weight:700; color:var(--text);
    position:relative;
  }
  .filter-chip select{
    position:absolute; inset:0; opacity:0; width:100%; height:100%; border:none; appearance:none;
  }
  .filter-chip .chev{color:var(--text-2); font-size:10px;}
  .filter-chip.on{background:var(--blue-tint); color:var(--blue-dark);}

  /* ---------------- grid ---------------- */
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .g-card{
    background:var(--bg); border:1px solid var(--divider); border-radius:var(--radius-card); overflow:hidden;
    position:relative;
  }
  .g-media{aspect-ratio:1/1; position:relative; display:flex; align-items:center; justify-content:center; font-size:48px;}
  .g-timer{position:absolute; top:8px; left:8px; display:flex; gap:3px;}
  .g-timer span{background:rgba(255,255,255,0.92); color:#0B0C0F; font-size:10px; font-weight:800; padding:3px 5px; border-radius:6px; line-height:1;}
  .g-check{
    position:absolute; top:8px; right:8px; width:22px; height:22px; border-radius:50%;
    background:rgba(255,255,255,0.9); border:1.5px solid #D8DBE3; display:flex; align-items:center; justify-content:center; font-size:12px; color:transparent;
  }
  .g-card.selected{box-shadow:0 0 0 2px var(--blue) inset;}
  .g-card.selected .g-check{background:var(--blue); border-color:var(--blue); color:#fff;}
  .g-body{padding:9px 10px 10px;}
  .g-name{font-size:13.5px; font-weight:700; line-height:1.25; margin-bottom:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .g-id{font-size:10.5px; color:var(--text-2); font-weight:600; margin-bottom:7px;}
  .g-bid-label{font-size:10px; color:var(--text-2); font-weight:700; text-transform:uppercase; letter-spacing:0.02em;}
  .g-bid-value{display:flex; align-items:center; gap:4px; font-size:14px; font-weight:800; margin:2px 0 8px;}
  .g-btn{
    width:100%; background:var(--blue); color:#fff; border-radius:11px; padding:9px 0; font-size:12.5px; font-weight:800;
  }
  .g-btn.added{background:var(--blue-tint); color:var(--blue-dark);}
  .empty{grid-column:1/-1; text-align:center; padding:50px 16px; color:var(--text-2); font-size:13.5px;}
  .empty b{display:block; color:var(--text); font-size:15px; margin-bottom:5px;}

  /* ---------------- my gifts list ---------------- */
  .stats-row{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
  .stat-box{background:var(--bg-3); border-radius:14px; padding:12px 14px;}
  .stat-box .l{font-size:11px; color:var(--text-2); font-weight:700; margin-bottom:5px;}
  .stat-box .v{font-size:18px; font-weight:800; display:flex; align-items:center; gap:5px;}
  .list-row{
    display:flex; align-items:center; gap:12px; padding:10px 6px; border-radius:14px;
  }
  .list-row:active{background:var(--bg-3);}
  .list-thumb{width:52px; height:52px; border-radius:12px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:26px; position:relative;}
  .list-badge{position:absolute; bottom:-3px; right:-3px; background:#fff; border-radius:6px; padding:1px 4px; font-size:8px; font-weight:800;}
  .list-info{flex:1; min-width:0;}
  .list-name{font-size:14.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .list-sub{font-size:12px; color:var(--text-2); font-weight:600; margin-top:1px;}
  .list-price{display:flex; align-items:center; gap:4px; font-size:14px; font-weight:800; flex-shrink:0;}
  .list-chevron{color:var(--text-2); font-size:16px; margin-left:2px;}

  /* ---------------- detail screen ---------------- */
  .detail-media{
    width:100%; aspect-ratio:1/1; border-radius:22px; position:relative; overflow:hidden;
    display:flex; align-items:center; justify-content:center; font-size:110px; margin-bottom:16px;
  }
  .detail-scrim{position:absolute; left:0; right:0; bottom:0; height:46%; background:linear-gradient(to top, rgba(0,0,0,0.55), transparent);}
  .detail-title{position:absolute; left:18px; bottom:16px; color:#fff;}
  .detail-title .n{font-size:22px; font-weight:800;}
  .detail-title .i{font-size:13px; font-weight:600; opacity:0.85; margin-top:2px;}
  .detail-attrs{display:flex; gap:7px; margin-bottom:18px; flex-wrap:wrap;}
  .attr-chip{background:var(--bg-3); border-radius:10px; padding:8px 12px; font-size:11.5px;}
  .attr-chip span{display:block; color:var(--text-2); font-size:9.5px; font-weight:700; text-transform:uppercase; margin-bottom:2px;}
  .detail-actions{display:flex; gap:10px; margin-bottom:22px;}
  .action-btn{
    flex:1; display:flex; align-items:center; justify-content:center; gap:7px;
    background:var(--bg-3); border-radius:14px; padding:14px 0; font-size:14px; font-weight:700; color:var(--text);
  }
  .action-btn.on-sale{background:var(--blue-tint); color:var(--blue-dark);}
  .detail-section-title{font-size:13px; font-weight:800; color:var(--text-2); text-transform:uppercase; letter-spacing:0.03em; margin:0 2px 8px;}

  /* ---------------- sell sheet ---------------- */
  .sheet-overlay{
    position:absolute; inset:0; background:rgba(10,12,18,0.5); z-index:60; display:none; align-items:flex-end;
  }
  .sheet-overlay.open{display:flex;}
  .sheet{
    background:var(--bg); width:100%; border-radius:24px 24px 0 0; padding:10px 18px 26px;
    animation:up .22s ease;
  }
  @keyframes up{from{transform:translateY(20px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .sheet-handle{width:36px; height:4px; background:var(--divider); border-radius:3px; margin:6px auto 16px;}
  .sheet-title{font-size:17px; font-weight:800; margin-bottom:14px;}
  .field-label{font-size:12px; font-weight:700; color:var(--text-2); margin-bottom:7px; display:block;}
  .price-field{position:relative; margin-bottom:8px;}
  .price-field input{
    width:100%; background:var(--bg-3); border:1.5px solid var(--divider); border-radius:14px; padding:14px 52px 14px 16px;
    font-size:16px; font-weight:700; color:var(--text); outline:none;
  }
  .price-field input:focus{border-color:var(--blue);}
  .price-field .suffix{position:absolute; right:16px; top:50%; transform:translateY(-50%); font-size:13px; font-weight:700; color:var(--text-2);}
  .fee-line{display:flex; justify-content:space-between; font-size:12.5px; color:var(--text-2); font-weight:600; padding:2px 2px 16px;}
  .sheet-btn{width:100%; background:var(--blue); color:#fff; border-radius:14px; padding:14px 0; font-size:15px; font-weight:800;}
  .sheet-error{color:#E5484D; font-size:12.5px; font-weight:600; margin:-6px 0 12px; display:none;}
  .sheet-error.show{display:block;}

  /* ---------------- main button (checkout bar) ---------------- */
  .main-btn-wrap{
    position:absolute; left:0; right:0; bottom:0; padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, #fff 60%, rgba(255,255,255,0));
    display:none; z-index:30;
  }
  .main-btn-wrap.show{display:block;}
  .main-btn{
    width:100%; background:var(--blue); color:#fff; border-radius:15px; padding:15px 0; font-size:15.5px; font-weight:800;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }

  /* ---------------- toast ---------------- */
  .toast{
    position:absolute; left:16px; right:16px; top:64px; z-index:80;
    background:#1C1D22; color:#fff; border-radius:13px; padding:12px 16px; font-size:13px; font-weight:600;
    transform:translateY(-140%); opacity:0; transition:all .28s cubic-bezier(.2,.9,.3,1.1);
    display:flex; align-items:center; gap:9px;
  }
  .toast.show{transform:translateY(0); opacity:1;}
  .toast-dot{width:7px; height:7px; border-radius:50%; background:var(--green); flex-shrink:0;}

  .caption{
    text-align:center; color:#8B90A0; font-size:12.5px; margin-top:18px; max-width:382px;
  }
</style>
</head>
<body>

<div>
<div class="device">
  <div class="device-screen" id="deviceScreen">
    <div class="island"></div>

    <div class="statusbar">
      <span>9:41</span>
      <div class="icons">
        <div class="sb-signal"><i></i><i></i><i></i><i></i></div>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 9.5C8.6 9.5 9.1 9.7 9.5 10.1L8 12L6.5 10.1C6.9 9.7 7.4 9.5 8 9.5Z" fill="#0B0C0F"/><path d="M5.3 7.3C6.1 6.6 7 6.2 8 6.2C9 6.2 9.9 6.6 10.7 7.3L9.6 8.6C9.1 8.2 8.6 8 8 8C7.4 8 6.9 8.2 6.4 8.6L5.3 7.3Z" fill="#0B0C0F"/><path d="M2.7 4.6C4.1 3.3 6 2.5 8 2.5C10 2.5 11.9 3.3 13.3 4.6L12.2 5.9C11.1 4.9 9.6 4.3 8 4.3C6.4 4.3 4.9 4.9 3.8 5.9L2.7 4.6Z" fill="#0B0C0F"/></svg>
        <div class="sb-battery"><i></i></div>
      </div>
    </div>

    <div class="app-header">
      <div class="head-row" id="headRow">
        <button class="pill-btn" id="closeBtn">✕ Close</button>
        <div class="head-right">
          <button class="icon-btn" id="chevBtn">⌄</button>
          <button class="icon-btn" id="kebabBtn">⋮</button>
        </div>
      </div>
      <div class="balance-row">
        <div class="user-pill">
          <div class="avatar">🦊</div>
          <div class="star-pill">⭐ <span id="starBalance">100</span></div>
        </div>
        <div class="ton-pill">
          <div class="ton-pill-inner">
            <svg class="ton-diamond" viewBox="0 0 24 24" fill="none"><path d="M12 2L22 8L12 22L2 8L12 2Z" fill="white" fill-opacity="0.95"/><path d="M12 2L22 8H2L12 2Z" fill="white" fill-opacity="0.6"/></svg>
            <span id="tonBalance">23,32</span>
          </div>
          <button class="ton-add" id="topUpBtn">+</button>
        </div>
      </div>

      <div class="tabs-row" id="tabsRow">
        <button class="tab-btn active" data-screen="market">Маркет</button>
        <button class="tab-btn" data-screen="mygifts">Мои подарки</button>
      </div>
    </div>

    <div class="app-body" id="appBody">

      <!-- ============ MARKET SCREEN ============ -->
      <div class="screen active" id="screen-market">
        <div class="total-card" id="totalCard">
          <div class="total-top">
            <div class="total-label">💰 Total price ⓘ</div>
            <div class="total-actions">
              <button class="reset-btn" id="resetPriceBtn">↺ Reset price</button>
              <button class="kebab-btn" id="cartKebabBtn">⋮</button>
            </div>
          </div>
          <div class="total-value" id="totalValue">0 TON</div>
          <div class="total-sub" id="totalSub">$0 ≈ 0⭐</div>
        </div>

        <div class="search-row">
          <div class="search-box">
            <span style="color:var(--text-2); font-size:14px;">⌕</span>
            <input type="text" id="searchInput" placeholder="Search">
          </div>
          <button class="filter-icon-btn" id="filterToggleBtn">☰</button>
        </div>

        <div class="filter-row" id="filterRow">
          <div class="filter-chip"><span id="modelLabel">Model  All</span><span class="chev">⌄</span><select id="filterModel"></select></div>
          <div class="filter-chip"><span id="backdropLabel">Backdrop  All</span><span class="chev">⌄</span><select id="filterBackdrop"></select></div>
          <div class="filter-chip"><span id="symbolLabel">Symbol  All</span><span class="chev">⌄</span><select id="filterSymbol"></select></div>
        </div>

        <div class="grid" id="marketGrid"></div>
      </div>

      <!-- ============ MY GIFTS SCREEN ============ -->
      <div class="screen" id="screen-mygifts">
        <div class="stats-row">
          <div class="stat-box">
            <div class="l">Подарков</div>
            <div class="v" id="myCount">0</div>
          </div>
          <div class="stat-box">
            <div class="l">Оценка портфеля</div>
            <div class="v"><svg class="ton-diamond" style="width:14px;height:14px" viewBox="0 0 24 24" fill="none"><path d="M12 2L22 8L12 22L2 8L12 2Z" fill="#0098EA"/></svg><span id="myValue">0</span></div>
          </div>
        </div>
        <div class="detail-section-title">Коллекция</div>
        <div id="myGiftsList"></div>
      </div>

      <!-- ============ DETAIL SCREEN ============ -->
      <div class="screen" id="screen-detail">
        <div class="detail-media" id="detailMedia">
          <div class="detail-scrim"></div>
          <div class="detail-title">
            <div class="n" id="detailName"></div>
            <div class="i" id="detailId"></div>
          </div>
        </div>
        <div class="detail-attrs" id="detailAttrs"></div>
        <div class="detail-actions">
          <button class="action-btn" id="setBtn">⊙ Set</button>
          <button class="action-btn" id="sellBtn">🔒 Sell</button>
        </div>
        <div class="detail-section-title">Ещё подарки</div>
        <div id="detailOtherList"></div>
      </div>

    </div>

    <div class="main-btn-wrap" id="mainBtnWrap">
      <button class="main-btn" id="mainBuyBtn">Купить <span id="mainBtnCount"></span></button>
    </div>

    <div class="sheet-overlay" id="sheetOverlay">
      <div class="sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-title">Выставить на продажу</div>
        <label class="field-label">Цена</label>
        <div class="price-field">
          <input type="number" min="0.1" step="0.1" id="sellPriceInput" placeholder="Например, 12.5">
          <span class="suffix">TON</span>
        </div>
        <div class="fee-line"><span>Комиссия площадки 3%</span><span id="sellFeeLine">0 TON</span></div>
        <div class="sheet-error" id="sellSheetError">Укажи цену от 0.1 TON</div>
        <button class="sheet-btn" id="confirmSellBtn">Выставить лот</button>
      </div>
    </div>

    <div class="toast" id="toast"><span class="toast-dot"></span><span id="toastText">Готово</span></div>

  </div>
</div>
<div class="caption">Демо Telegram Mini App — интерфейс маркетплейса цифровых подарков</div>
</div>

<script>
/* ================= DATA ================= */
const RARITY_TINT = {common:'#F1F2F6', rare:'#E6F6FF', epic:'#F1EBFF', legendary:'#FFF6DF'};

let idSeq = 0;

/* ================= HELPERS ================= */
function fmtRU(n){
  const s = (Math.round(n*100)/100).toFixed(2).replace(/\.00$/, '').replace(/(\.\d)0$/,'$1');
  return s.replace('.', ',');
}
function ton(n){ return fmtRU(n) + ' TON'; }
function usd(n){ return '$' + fmtRU(n*7.6); }

function timeLeft(deadline){
  let s = Math.max(0, Math.floor((deadline - Date.now())/1000));
  const d = Math.floor(s/86400); s -= d*86400;
  const h = Math.floor(s/3600); s -= h*3600;
  const m = Math.floor(s/60); s -= m*60;
  return {d,h,m,s, expired: deadline-Date.now()<=0};
}
function pad(n){ return n.toString().padStart(2,'0'); }

function showToast(text){
  const t = document.getElementById('toast');
  document.getElementById('toastText').textContent = text;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2400);
}

function setScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  document.getElementById('appBody').scrollTop = 0;

  const inDetail = name === 'detail';
  document.getElementById('closeBtn').style.display = inDetail ? 'none' : 'flex';
  document.getElementById('backBtnSlot') && 0;
  document.getElementById('tabsRow').style.display = inDetail ? 'none' : 'flex';

  if(name !== 'detail'){
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.screen===name));
  }
  refreshMainButton();
}

/* ================= FILTERS ================= */
function uniq(arr){ return [...new Set(arr)]; }
function populateFilters(){
  fillSelect('filterModel', uniq(items.map(i=>i.model)), 'Model');
  fillSelect('filterBackdrop', uniq(items.map(i=>i.backdrop)), 'Backdrop');
  fillSelect('filterSymbol', uniq(items.map(i=>i.symbol)), 'Symbol');
}
function fillSelect(id, values, label){
  const sel = document.getElementById(id);
  sel.innerHTML = `<option value="all">All</option>` + values.map(v=>`<option value="${v}">${v}</option>`).join('');
  sel.dataset.labelPrefix = label;
}
['filterModel','filterBackdrop','filterSymbol'].forEach(id=>{
  document.getElementById(id).addEventListener('change', (e)=>{
    const sel = e.target;
    const labelId = {filterModel:'modelLabel', filterBackdrop:'backdropLabel', filterSymbol:'symbolLabel'}[id];
    const chip = sel.closest('.filter-chip');
    const label = document.getElementById(labelId);
    label.textContent = `${sel.dataset.labelPrefix}  ${sel.value==='all' ? 'All' : sel.value}`;
    chip.classList.toggle('on', sel.value !== 'all');
    renderMarket();
  });
});

/* ================= MARKET RENDER ================= */
function mediaBg(item){ return `background:linear-gradient(155deg, ${item.c1}, ${item.c2});`; }

function renderMarket(){
  const grid = document.getElementById('marketGrid');
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const fm = document.getElementById('filterModel').value;
  const fb = document.getElementById('filterBackdrop').value;
  const fs = document.getElementById('filterSymbol').value;

  let list = items.filter(i=>i.listed);
  if(q) list = list.filter(i=>i.name.toLowerCase().includes(q) || i.collection.toLowerCase().includes(q));
  if(fm!=='all') list = list.filter(i=>i.model===fm);
  if(fb!=='all') list = list.filter(i=>i.backdrop===fb);
  if(fs!=='all') list = list.filter(i=>i.symbol===fs);
  list = list.slice().sort((a,b)=>a.deadline-b.deadline);

  if(list.length===0){
    grid.innerHTML = `<div class="empty"><b>Ничего не найдено</b>Попробуй изменить фильтры</div>`;
    return;
  }

  grid.innerHTML = list.map(item=>{
    const tl = timeLeft(item.deadline);
    const segs = tl.expired ? [['','—']] : [['d',tl.d],['',pad(tl.h)],['',pad(tl.m)],['',pad(tl.s)]];
    const timerHtml = tl.expired
      ? `<span>Ended</span>`
      : segs.map(s=>`<span>${s[1]}${s[0]}</span>`).join('');
    const sel = item.selected;
    return `
    <div class="g-card ${sel?'selected':''}" data-id="${item.id}">
      <div class="g-media" style="${mediaBg(item)}">${item.emoji}
        <div class="g-timer">${timerHtml}</div>
        <div class="g-check">✓</div>
      </div>
      <div class="g-body">
        <div class="g-name">${item.name}</div>
        <div class="g-id">${item.num}</div>
        <div class="g-bid-label">Highest Bid</div>
        <div class="g-bid-value"><svg class="ton-diamond" style="width:13px;height:13px" viewBox="0 0 24 24" fill="none"><path d="M12 2L22 8L12 22L2 8L12 2Z" fill="#0098EA"/></svg>${fmtRU(item.price)}</div>
        <button class="g-btn ${sel?'added':''}" data-select="${item.id}">${sel ? 'Added ✓' : 'Bid '+ton(item.price)}</button>
      </div>
    </div>`;
  }).join('');

  grid.querySelectorAll('[data-select]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      toggleSelect(parseInt(btn.dataset.select));
    });
  });
  grid.querySelectorAll('.g-card').forEach(c=>{
    c.addEventListener('click', ()=>toggleSelect(parseInt(c.dataset.id)));
  });
}
document.getElementById('searchInput').addEventListener('input', renderMarket);

function toggleSelect(id){
  const item = items.find(i=>i.id===id);
  if(!item) return;
  item.selected = !item.selected;
  renderMarket();
  refreshCart();
}

function refreshCart(){
  const selected = items.filter(i=>i.selected);
  const total = selected.reduce((s,i)=>s+i.price,0);
  const card = document.getElementById('totalCard');
  card.classList.toggle('show', selected.length>0);
  document.getElementById('totalValue').textContent = ton(total);
  document.getElementById('totalSub').textContent = `${usd(total)} ≈ ${Math.round(total*4.5)}⭐`;
  refreshMainButton(selected, total);
}

function refreshMainButton(selectedArg, totalArg){
  const onMarket = document.getElementById('screen-market').classList.contains('active');
  const selected = selectedArg || items.filter(i=>i.selected);
  const total = totalArg !== undefined ? totalArg : selected.reduce((s,i)=>s+i.price,0);
  const wrap = document.getElementById('mainBtnWrap');
  wrap.classList.toggle('show', onMarket && selected.length>0);
  document.getElementById('mainBtnCount').textContent = selected.length>0 ? `· ${selected.length} шт · ${ton(total)}` : '';
}

document.getElementById('cartKebabBtn').addEventListener('click', ()=>{
  items.forEach(i=>i.selected=false);

});

document.getElementById('mainBuyBtn').addEventListener('click', ()=>{
  const selected = items.filter(i=>i.selected);
  const total = selected.reduce((s,i)=>s+i.price,0);
  if(wallet < total){
    showToast('Недостаточно TON на балансе');
    return;
  }
  wallet -= total;
  selected.forEach(i=>{ i.owned=true; i.listed=false; i.selected=false; });
  document.getElementById('tonBalance').textContent = fmtRU(wallet);
  renderMarket();
  refreshCart();
  showToast(`Куплено ${selected.length} подарков за ${ton(total)}`);
});
